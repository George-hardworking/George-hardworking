name: Restore original profile
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact pre-session files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree --reset -u da04ab11e9ca2cbdd1ce80002818f12d0fb97eb5
          git diff --cached --stat
          git commit -m "Restore original profile before language statistics setup"
          git push origin HEAD:main
